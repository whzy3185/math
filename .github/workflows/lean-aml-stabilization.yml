name: Lean AML stabilization verification

on:
  push:
    branches:
      - research/aml-production-consumption-stabilization
    paths:
      - "formal/**"
      - ".github/workflows/lean-aml-stabilization.yml"
  workflow_dispatch:

concurrency:
  group: lean-aml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject placeholders and explicit axioms
        run: |
          if grep -R -n -E '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' \
              formal/AMLStabilization formal/AMLStabilization.lean; then
            echo "Forbidden Lean placeholder or explicit axiom found."
            exit 1
          fi

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve mathlib
        working-directory: formal
        run: |
          lake update
          lake exe cache get

      - name: Build Lean library
        working-directory: formal
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Upload Lean failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log-${{ github.run_id }}
          path: formal/lean-build.log
          if-no-files-found: ignore
          retention-days: 7
