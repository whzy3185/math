name: Lean Lonely Runner Formalization

on:
  push:
    branches: [lean-lonely-runner-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct formalization project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal/lean-lonely-runner/project
          cat formal/lean-lonely-runner/.ci_payload/chunk*.b64 > /tmp/lonely_runner_lean_v0_3.b64
          base64 -d /tmp/lonely_runner_lean_v0_3.b64 > /tmp/lonely_runner_lean_v0_3.zip
          unzip -q /tmp/lonely_runner_lean_v0_3.zip -d /tmp/lr_unpacked
          cp -a /tmp/lr_unpacked/lonely_runner_lean_v0_3/. formal/lean-lonely-runner/project/
          sha256sum /tmp/lonely_runner_lean_v0_3.zip
          test -f formal/lean-lonely-runner/project/lakefile.lean
          test -f formal/lean-lonely-runner/project/lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean-lonely-runner/project
      - name: Real lake build
        working-directory: formal/lean-lonely-runner/project
        run: lake build
      - name: Reject sorry/admit/native_decide
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|by[[:space:]]+native_decide' formal/lean-lonely-runner/project/LonelyRunner*.lean formal/lean-lonely-runner/project/LonelyRunner || exit 1
