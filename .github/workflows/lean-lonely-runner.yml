name: Lean Lonely Runner Formalization

on:
  push:
    branches: [lean-lonely-runner-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct formalization project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal/lean-lonely-runner/project
          mkdir -p formal/lean-lonely-runner/project
          cat formal/lean-lonely-runner/.ci_payload/chunk*.b64 > /tmp/lonely_runner_lean_v0_3.b64
          base64 -d /tmp/lonely_runner_lean_v0_3.b64 > /tmp/lonely_runner_lean_v0_3.zip
          unzip -q /tmp/lonely_runner_lean_v0_3.zip -d /tmp/lr_unpacked
          cp -a /tmp/lr_unpacked/lonely_runner_lean_v0_3/. formal/lean-lonely-runner/project/
          python formal/lean-lonely-runner/patch_v1.py
          python formal/lean-lonely-runner/patch_v2.py
          python formal/lean-lonely-runner/patch_v3.py
          python formal/lean-lonely-runner/patch_v4.py
          python formal/lean-lonely-runner/patch_v5.py
          python formal/lean-lonely-runner/patch_v6.py
          sha256sum /tmp/lonely_runner_lean_v0_3.zip
          test -f formal/lean-lonely-runner/project/lakefile.lean
          test -f formal/lean-lonely-runner/project/lean-toolchain
      - name: Cache Lean toolchain and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean-lonely-runner/project/.lake/packages
          key: lonely-runner-lean4331-mathlib4331-v1
      - name: Install elan and pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.1
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Resolve dependencies
        working-directory: formal/lean-lonely-runner/project
        run: lake update
      - name: Fetch mathlib cache
        working-directory: formal/lean-lonely-runner/project
        run: lake exe cache get
      - name: Real lake build
        working-directory: formal/lean-lonely-runner/project
        run: lake build
      - name: Reject sorry/admit/native_decide
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|by[[:space:]]+native_decide' formal/lean-lonely-runner/project/LonelyRunner*.lean formal/lean-lonely-runner/project/LonelyRunner || exit 1
